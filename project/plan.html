<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lima Uncovered</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="description" content="Discover best restaurants and activities">
    <meta name="author" content="Cristofer Amachi">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <img src="images/logo.webp" alt="icon" height="50" width="140">
        <button id="ham-btn" class="hamburger" aria-label="menu"></button>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li class="current">
                <a href="#" aria-label="home">Home</a>
            </li>
            <li>
                <a href="#" aria-label="chamber project">Chamber Project</a>
            </li>
            <li>
                <a href="#" aria-label="final project">Final Project</a>
            </li>
        </ul>
    </nav>
    <main>
        <h1>Travel Concierge</h1>
        <p>Get a customized Lima itinerary</p>
        <form action="thankyou.html" method="get">
            <label>Full Name
                <input type="text" autocomplete="name" title="Full Name"
                    name="full-name" required>
            </label>
            <label>Email Address
                <input type="email" placeholder="name@email.com" title="Email Address" autocomplete="email"
                    name="email" required>
            </label>
            <label>Arrival Date
                <input type="date" title="Arrival Date"
                    name="arrival" required>
            </label>
            <label>Number of Travelers
                <input type="number" min="1" max="20" 
                    name="num-of-travelers" required>
            </label>
            <label>Trip Length (Days)
                <select name="trip-length" required>
                    <option value="" disabled selected>Choose a duration...</option>
                    <option value="1-2">1-2</option>
                    <option value="3-4">3-4</option>
                    <option value="5-7">5-7</option>
                    <option value="7+">7+ days</option>
                </select>
            </label>
            <label>Preferred Base District
                <select name="district">
                    <option value="all">All</option>
                    <option value="miraflores">Miraflores</option>
                    <option value="barranco">Barranco</option>
                    <option value="centro historico">Centro Histórico</option>
                    <option value="san isidro">San Isidro</option>
                </select>
            </label>
            <fieldset class="radio-group">
                <legend>Budget Level <span>*</span></legend>
                <label><input type="radio" name="budget" value="$">$</label>
                <label><input type="radio" name="budget" value="$$">$$</label>
                <label><input type="radio" name="budget" value="$$$">$$$</label>
                <label><input type="radio" name="budget" value="$$$$">$$$$</label>
            </fieldset>
            <fieldset class="checkbox-group">
                <legend>What are your main interests in Lima?</legend>
                <label><input type="checkbox" name="interests" value="$">Food & Ceviche</label>
                <label><input type="checkbox" name="interests" value="$$">History & Museums</label>
                <label><input type="checkbox" name="interests" value="$$$">Outdoors & Surf</label>
                <label><input type="checkbox" name="interests" value="$$$$">Nightlife & Arts</label>
            </fieldset>
            <label>Dietary Notes / Special Requests
                <textarea name="notes" title="Allergies, vegetarian/vegan needs"></textarea>
            </label>
            <input id="time-stamp" type="hidden" name="current-time-stamp" value="">
            <input type="submit" class="main-button" value="Apply">
        </form>
    </main>
    <footer>
        <div>
            <a href="#" target="_blank" aria-label="github"><img src="images/github.svg" alt="github" width="16"
                    height="16"></a>
            <a href="#" target="_blank" aria-label="linkedin"><img src="images/linkedin.svg" alt="linkedin" width="16"
                    height="16"></a>
            <a href="#" target="_blank" aria-label="facebook"><img src="images/facebook.svg" alt="facebook" width="16"
                    height="16"></a>
        </div>
        <span id="current-year"></span>
        <span>Cristofer Amachi | Peru</span>
        <br><span id="last-modified"></span>
    </footer>
</body>
</html>
