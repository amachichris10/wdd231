<body>
    <header>
        <img src="images/icon.svg" alt="icon" height="24" width="24">
        <span>Amazon's Chamber of Comerece</span>

    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li class="current">
                <a href="#">Home</a>
            </li>
            <li>

            <li>

            </li>
            <li>

            </li>
        </ul>
    </nav>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 32rem)" srcset="images/hero-large.webp">
                <img src="images/hero-small.webp" alt="hero-image" width="512" height="300">
            </picture>
            <div>

                <button>Join us</button>

            <span id="current-temp"></span>

                <img

                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"

                style="display: none;"

        <div class="forecast">
            <h2>Forecast</h2>
            <div id="forecast"></div>
        </div>
        </div>
        
        <div class="spotlights">

            </div>

    <footer>
        <div class="social">
            <a href="#" target="_blank"><img src="images/github.svg" alt="github" width="16" height="16"></a>
